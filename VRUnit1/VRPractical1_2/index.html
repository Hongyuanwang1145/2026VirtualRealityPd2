<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

  <a-assets>
    <img id="walltexture" src="Brick.jpg">
    <img id="grasstexture" src="">
  </a-assets>

  <a-sky color="#7BC8A4"></a-sky>

  <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200"material="src: #grassTexture; repeat: 20 20"></a-plane>
  <!-- ROAD -->
  <a-box position="0 0.04 5"width="200" height="0.06" depth="5"color="#555555"></a-box>
  <!-- ROAD MARKING -->
  <a-box position="0 0.08 5" width="200" height="0.02" depth="0.12" color="white"></a-box>
  <!-- HOUSE 1: LEFT -->
  <a-entity position="-7 0 0">
    <!-- Main walls -->
    <a-box position="0 1.5 0" width="4" height="3" depth="3" color="#777777"></a-box>
    <!-- Roof slopes -->
    <a-box position="-1 3.2 0" rotation="0 0 35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>
    <a-box position="1 3.2 0" rotation="0 0 -35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>
    <!-- Empty interior floor -->
    <a-box position="0 0.1 0" width="3.8" height="0.08" depth="2.8" color="#D8C7A8"></a-box>
    <!-- Window frames -->
    <a-box position="-1.15 1.9 1.55" width="0.9" height="0.95" depth="0.08" color="white"></a-box>
    <a-box position="1.15 1.9 1.55" width="0.9" height="0.95" depth="0.08" color="white"></a-box>
    <!-- Window glass -->
    <a-box position="-1.15 1.9 1.60" width="0.72" height="0.77" depth="0.03" color="#BDEBFF"></a-box>
    <a-box position="1.15 1.9 1.60" width="0.72" height="0.77" depth="0.03" color="#BDEBFF"></a-box>
    <!-- Window crossbars -->
    <a-box position="-1.15 1.9 1.63" width="0.04" height="0.77" depth="0.03" color="white"></a-box>
    <a-box position="-1.15 1.9 1.63" width="0.72" height="0.04" depth="0.03" color="white"></a-box>
    <a-box position="1.15 1.9 1.63" width="0.04" height="0.77" depth="0.03" color="white"></a-box>
    <a-box position="1.15 1.9 1.63" width="0.72" height="0.04" depth="0.03" color="white"></a-box>
    <!--Door -->
    <a-box position="-0.53 0.9 1.55" width="0.08" height="1.9" depth="0.12" color="white"></a-box>
    <a-box position="0.53 0.9 1.55" width="0.08" height="1.9" depth="0.12" color="white"></a-box>
    <a-box position="0 1.85 1.55" width="1.14" height="0.08" depth="0.12" color="white"></a-box>
    <a-entity position="-0.49 0 1.62" rotation="0 -100 0">
      <a-box position="0.45 0.9 0" width="0.9" height="1.8" depth="0.07" color="#F3F0E8"></a-box>
      <a-sphere position="0.78 0.9 0.06"  radius="0.05" color="#C5A33A"></a-sphere></a-entity>
</a-entity>

  <!-- HOUSE 2: CENTER -->
  <a-entity position="0 0 0">
    <a-box position="0 1.5 0" width="4" height="3" depth="3" color="#777777"></a-box>
    <!-- Roof -->
    <a-box position="-1 3.2 0" rotation="0 0 35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>
    <a-box position="1 3.2 0" rotation="0 0 -35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>
    <!-- Interior floor -->
    <a-box position="0 0.1 0" width="3.8" height="0.08" depth="2.8" color="#D8C7A8"></a-box>
    <!-- Window  -->
    <a-box position="-1.15 1.9 1.55" width="0.9" height="0.95" depth="0.08" color="white"></a-box>
    <a-box position="1.15 1.9 1.55" width="0.9" height="0.95" depth="0.08" color="white"></a-box>
    <!-- Window glass -->
    <a-box position="-1.15 1.9 1.60" width="0.72" height="0.77" depth="0.03" color="#BDEBFF"></a-box>
    <a-box position="1.15 1.9 1.60" width="0.72" height="0.77" depth="0.03" color="#BDEBFF"></a-box>
    <!-- Window crossbars -->
    <a-box position="-1.15 1.9 1.63" width="0.04" height="0.77" depth="0.03" color="white"></a-box>
    <a-box position="-1.15 1.9 1.63" width="0.72" height="0.04" depth="0.03" color="white"></a-box>
    <a-box position="1.15 1.9 1.63" width="0.04" height="0.77" depth="0.03" color="white"></a-box>
    <a-box position="1.15 1.9 1.63" width="0.72" height="0.04" depth="0.03" color="white"></a-box>
    <!-- Door frame -->
    <a-box position="-0.53 0.9 1.55" width="0.08" height="1.9" depth="0.12"color="white"></a-box>
    <a-box position="0.53 0.9 1.55" width="0.08" height="1.9" depth="0.12" color="white"></a-box>
    <a-box position="0 1.85 1.55" width="1.14" height="0.08" depth="0.12" color="white"></a-box>
    <!-- Open door -->
    <a-entity position="-0.49 0 1.62"  rotation="0 -100 0">
      <a-box position="0.45 0.9 0" width="0.9" height="1.8" depth="0.07" color="#F3F0E8"></a-box>
      <a-sphere position="0.78 0.9 0.06" radius="0.05" color="#C5A33A"></a-sphere>
    </a-entity>
  </a-entity>
  <!-- HOUSE 3-->
  <a-entity position="7 0 0">
    <a-box position="0 1.5 0" width="4" height="3" depth="3" color="#777777"></a-box>
    <!-- Roof -->
    <a-box position="-1 3.2 0" rotation="0 0 35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>
    <a-box position="1 3.2 0" rotation="0 0 -35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>

    <!-- Window glass -->
    <a-box position="-1.15 1.9 1.60" width="0.72" height="0.77" depth="0.03" color="#BDEBFF"></a-box>
    <a-box position="1.15 1.9 1.60" width="0.72" height="0.77" depth="0.03" color="#BDEBFF"></a-box>
    <!-- Window crossbars -->
    <a-box position="-1.15 1.9 1.63" width="0.04" height="0.77" depth="0.03" color="white"></a-box>
    <a-box position="-1.15 1.9 1.63" width="0.72" height="0.04" depth="0.03" color="white"></a-box>
    <a-box position="1.15 1.9 1.63" width="0.04" height="0.77" depth="0.03" color="white"></a-box>
    <a-box position="1.15 1.9 1.63" width="0.72" height="0.04" depth="0.03" color="white"></a-box>
    <!-- Door frame -->
    <a-box position="-0.53 0.9 1.55" width="0.08" height="1.9" depth="0.12" color="white"></a-box>
    <a-box position="0.53 0.9 1.55" width="0.08" height="1.9" depth="0.12" color="white"></a-box>
    <a-box position="0 1.85 1.55" width="1.14" height="0.08" depth="0.12" color="white"></a-box>

    <a-entity position="-0.49 0 1.62" rotation="0 -100 0">
      <a-box position="0.45 0.9 0" width="0.9" height="1.8" depth="0.07" color="#F3F0E8"></a-box>
      <a-sphere position="0.78 0.9 0.06" radius="0.05" color="#C5A33A"></a-sphere>
    </a-entity>
  </a-entity>


  <!-- TREES -->
  <a-entity position="-10 0 -2">
    <a-cylinder position="0 1 0" radius="0.25" height="2" color="#743B22"></a-cylinder>
    <a-sphere position="0 2.7 0" radius="1.4" color="#087F23"></a-sphere>
</a-entity>
  <a-entity position="-4 0 -2">
    <a-cylinder position="0 1 0" radius="0.25" height="2" color="#743B22"></a-cylinder>
    <a-sphere position="0 2.7 0" radius="1.4" color="#087F23"></a-sphere>
  </a-entity>
  <a-entity position="4 0 -2">
    <a-cylinder position="0 1 0" radius="0.25" height="2" color="#743B22"></a-cylinder>
    <a-sphere position="0 2.7 0" radius="1.4" color="#087F23"></a-sphere>
  </a-entity>
  <a-entity position="10 0 -2">
    <a-cylinder position="0 1 0" radius="0.25" height="2" color="#743B22"></a-cylinder>
    <a-sphere position="0 2.7 0" radius="1.4" color="#087F23"></a-sphere>
  </a-entity>
  <!-- LIGHTING -->
  <a-light type="ambient" color="#FFFFFF" intensity="1"></a-light>
  <a-light type="directional"position="-5 10 5" intensity="1.5"></a-light>

  <!--car-->
  <a-entity position="3 0.3 5">
  <a-box position="0 0.25 0" width="1.2" height="0.55" depth="2"color="yellow"></a-box>
  <a-box position="0 0.55 0.65"width="1.15" height="0.25" depth="0.55" color="yellow"></a-box>
  <a-box position="0 0.7 -0.25" width="1.05" height="0.65" depth="1.05" color="yellow"></a-box>
  <a-box position="0 0.72 0.3" width="0.85" height="0.35" depth="0.02" color="#222222"></a-box>
  <a-box position="-0.53 0.72 -0.25" width="0.02" height="0.35" depth="0.75" color="#222222"></a-box>
  <a-box position="0.53 0.72 -0.25" width="0.02" height="0.35" depth="0.75" color="#222222"></a-box>
  <a-box position="0 0.05 1.05" width="1.25" height="0.18" depth="0.12" color="#333333"></a-box>

  <a-box position="0.38 0.3 1.04" width="0.18" height="0.18" depth="0.05" color="#FFFFCC"></a-box>
  <a-cylinder position="-0.62 -0.15 0.65" radius="0.28" height="0.18" rotation="0 0 90" color="#111111"></a-cylinder>
  <a-cylinder position="0.62 -0.15 0.65" radius="0.28" height="0.18" rotation="0 0 90" color="#111111"></a-cylinder>
  <a-cylinder position="-0.62 -0.15 -0.65" radius="0.28" height="0.18" rotation="0 0 90" color="#111111"></a-cylinder>
  <a-cylinder position="0.62 -0.15 -0.65" radius="0.28" height="0.18" rotation="0 0 90" color="#111111"></a-cylinder>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
