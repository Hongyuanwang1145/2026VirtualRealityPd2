<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
         <img id="grassTexture" src="https://cdn.aframe.io/a-painter/images/floor.jpg">
        <a-mixin id="wall" material="color: #777777; roughness: 1"></a-mixin>
        <a-mixin id="window"  material="color: #BDEBFF; metalness: 0.2; roughness: 0.2"></a-mixin>
      </a-assets>
      <a-plane position="0 0 0" rotation="-90 0 0" width="200" height="200" material="src: #grassTexture; repeat: 20 20">
      </a-plane>
      <a-box position="0 0.03 5"  width="200" height="0.05" depth="5" color="#555555"></a-box>
      <a-box position="0 0.07 5"  width="200" height="0.02" depth="0.12"  color="white"></a-box>
      <a-entity position="-7 0 0">
        <a-box position="0 1.5 0"  width="4" height="3" depth="3" mixin="wall"></a-box>
        <a-box position="-1 3.2 0" rotation="0 0 -35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>
        <a-box position="1 3.2 0" rotation="0 0 35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>
        <a-box position="0 0.9 1.53" width="0.9" height="1.8" depth="0.08" color="#F3F0E8"></a-box>
        <a-box position="-1.15 1.9 1.55" width="0.85" height="0.9" depth="0.08" color="white"></a-box>
        <a-box position="-1.15 1.9 1.60" width="0.68" height="0.72" depth="0.03" mixin="window"></a-box>
        <a-box position="1.15 1.9 1.55" width="0.85" height="0.9" depth="0.08" color="white"></a-box>
        <a-box position="1.15 1.9 1.60" width="0.68" height="0.72" depth="0.03" mixin="window"></a-box>
      </a-entity>
      <a-entity position="0 0 0">
        <a-box position="0 1.5 0" width="4" height="3" depth="3"  mixin="wall"></a-box>
        <a-box position="-1 3.2 0" rotation="0 0 -35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>
        <a-box position="1 3.2 0" rotation="0 0 35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>
        <a-box position="0 0.9 1.53"  width="0.9" height="1.8" depth="0.08" color="#F3F0E8"></a-box>
        <a-box position="-1.15 1.9 1.55"  width="0.85" height="0.9" depth="0.08"  color="white"></a-box>
        <a-box position="-1.15 1.9 1.60" width="0.68" height="0.72" depth="0.03" mixin="window"></a-box>
        <a-box position="1.15 1.9 1.55" width="0.85" height="0.9" depth="0.08" color="white"></a-box>
        <a-box position="1.15 1.9 1.60" width="0.68" height="0.72" depth="0.03" mixin="window"></a-box>
      </a-entity>
      <a-entity position="7 0 0">
        <a-box position="0 1.5 0" width="4" height="3" depth="3" mixin="wall"></a-box>
        <a-box position="-1 3.2 0" rotation="0 0 -35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>
        <a-box position="1 3.2 0" rotation="0 0 35" width="2.5" height="0.2" depth="3.5" color="#303030"></a-box>
        <a-box position="0 0.9 1.53" width="0.9" height="1.8" depth="0.08" color="#F3F0E8"></a-box>
        <a-box position="-1.15 1.9 1.55" width="0.85" height="0.9" depth="0.08" color="white"></a-box>
        <a-box position="-1.15 1.9 1.60" width="0.68" height="0.72" depth="0.03" mixin="window"></a-box>
        <a-box position="1.15 1.9 1.55" width="0.85" height="0.9" depth="0.08" color="white"></a-box>
        <a-box position="1.15 1.9 1.60" width="0.68" height="0.72" depth="0.03" mixin="window"></a-box>
      </a-entity>
      <a-entity position="-10 0 -2">
        <a-cylinder position="0 1 0" radius="0.25" height="2" color="#743B22"></a-cylinder>
        <a-sphere position="0 2.7 0" radius="1.4" color="#087F23"></a-sphere>
      </a-entity>
      <a-entity position="-4 0 -2">
        <a-cylinder position="0 1 0" radius="0.25" height="2" color="#743B22"></a-cylinder>
        <a-sphere position="0 2.7 0" radius="1.4" color="#087F23"></a-sphere>
      </a-entity>
      <a-entity position="4 0 -2">
        <a-cylinder position="0 1 0" radius="0.25" height="2"  color="#743B22"></a-cylinder>
        <a-sphere position="0 2.7 0" radius="1.4" color="#087F23"></a-sphere>
      </a-entity>
      <a-entity position="10 0 -2">
        <a-cylinder position="0 1 0" radius="0.25" height="2" color="#743B22"></a-cylinder>
        <a-sphere position="0 2.7 0" radius="1.4" color="#087F23"></a-sphere>
      </a-entity>
      <a-light type="ambient" color="#FFFFFF" intensity="1"></a-light>
      <a-light type="directional" position="-5 10 5" intensity="1.5"></a-light>
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#7BC8A4"></a-plane>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
